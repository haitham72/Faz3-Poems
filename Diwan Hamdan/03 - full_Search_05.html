<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔍 Full Search - Production Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #1a1a1a;
        color: white;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #00ff00;
      }

      .search-box {
        background: #2a2a2a;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 20px;
      }

      input {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        background: #1a1a1a;
        border: 2px solid #444;
        color: white;
        border-radius: 8px;
        margin-bottom: 15px;
      }
      input:focus {
        border-color: #00ff00;
        outline: none;
      }

      .toggles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-bottom: 15px;
      }

      .toggle {
        background: #333;
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        text-align: center;
        border: 2px solid #444;
        transition: all 0.2s;
        user-select: none;
      }

      .toggle.active {
        background: #00ff00;
        color: #000;
        border-color: #00ff00;
        font-weight: bold;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #00ff00;
        color: #000;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
      }

      .stats {
        background: #2a2a2a;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
      }
      .stats.show {
        display: block;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }

      .stat-item {
        background: #333;
        padding: 10px;
        border-radius: 6px;
        text-align: center;
      }

      .stat-label {
        font-size: 11px;
        color: #999;
        margin-bottom: 5px;
      }

      .stat-value {
        font-size: 20px;
        color: #00ff00;
        font-weight: bold;
      }

      .result {
        background: #2a2a2a;
        padding: 15px;
        margin: 12px 0;
        border-radius: 8px;
        border-left: 4px solid #00ff00;
      }

      .result-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .result-title {
        font-weight: bold;
        color: #00ff00;
        font-size: 16px;
      }

      .result-line {
        color: #ccc;
        font-size: 15px;
        line-height: 1.8;
        margin-bottom: 10px;
      }

      .result-meta {
        color: #666;
        font-size: 12px;
        margin-bottom: 10px;
      }

      .match-reasons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }

      .reason-tag {
        background: #333;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 11px;
        border: 1px solid #555;
      }

      .match-details {
        background: #1a1a1a;
        padding: 10px;
        border-radius: 6px;
        font-size: 12px;
      }

      .detail-item {
        padding: 4px 0;
        color: #999;
      }

      .detail-key {
        color: #00ff00;
        font-weight: bold;
      }
      .detail-value {
        color: #fff;
      }

      mark {
        background: #ffeb3b;
        color: #000;
        padding: 2px 4px;
        border-radius: 2px;
        font-weight: bold;
      }

      mark.entity {
        background: #ffe66d;
      }
      mark.animal {
        background: #ffd89b;
      }
      mark.place {
        background: #95e1d3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔍 Full Search - Production</h1>

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="ابحث..."
          autocomplete="off"
        />

        <div class="toggles">
          <div class="toggle active" data-column="title">📄 Title</div>
          <div class="toggle active" data-column="line">📝 Line</div>
          <div class="toggle" data-column="entities">👤 Entities</div>
          <div class="toggle" data-column="places">📍 Places</div>
          <div class="toggle" data-column="events">📅 Events</div>
          <div class="toggle" data-column="religion">☪️ Religion</div>
          <div class="toggle" data-column="subjects">🏷️ Subjects</div>
          <div class="toggle" data-column="animals">🐪 Animals</div>
          <div class="toggle" data-column="sentiments">💭 Sentiments</div>
        </div>

        <button id="searchBtn">🔍 بحث (Enter)</button>
      </div>

      <div class="stats" id="stats"></div>
      <div id="results"></div>
    </div>

    <script>
      const CONFIG = {
        SUPABASE_URL: "https://qnoqkbndjgbtxxnxezly.supabase.co",
        SUPABASE_KEY:
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFub3FrYm5kamdidHh4bnhlemx5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2OTY2OTIyMywiZXhwIjoyMDg1MjQ1MjIzfQ.eBtro9T_rC_FHI2CcShtpAv8uwHBkSCw8Ivul4szKE8",
      };

      const input = document.getElementById("searchInput");
      const searchBtn = document.getElementById("searchBtn");
      const results = document.getElementById("results");
      const stats = document.getElementById("stats");
      const toggles = document.querySelectorAll(".toggle");

      let enabledColumns = {
        title: true,
        line: true,
        entities: false,
        places: false,
        events: false,
        religion: false,
        subjects: false,
        animals: false,
        sentiments: false,
      };

      toggles.forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const column = toggle.dataset.column;
          enabledColumns[column] = !enabledColumns[column];
          toggle.classList.toggle("active");
        });
      });

      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") search();
      });
      searchBtn.addEventListener("click", search);

      async function search() {
        const query = input.value.trim();

        if (query.length < 2) {
          results.innerHTML = "";
          stats.classList.remove("show");
          return;
        }

        const start = performance.now();

        try {
          const response = await fetch(
            `${CONFIG.SUPABASE_URL}/rest/v1/rpc/full_search`,
            {
              method: "POST",
              headers: {
                apikey: CONFIG.SUPABASE_KEY,
                Authorization: `Bearer ${CONFIG.SUPABASE_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                search_query: query,
                enabled_columns: enabledColumns,
                result_limit: 150,
              }),
            },
          );

          const data = await response.json();
          const elapsed = Math.round(performance.now() - start);

          if (!response.ok) {
            console.error("Error:", data);
            results.innerHTML = `<div class="result" style="border-color: #f44;">Error: ${data.message}</div>`;
            return;
          }

          displayResults(data, query, elapsed);
        } catch (error) {
          console.error(error);
          results.innerHTML = `<div class="result" style="border-color: #f44;">Error: ${error.message}</div>`;
        }
      }

      function displayResults(data, query, time) {
        // Calculate stats
        const uniquePoems = new Set(data.map((r) => r.poem_id)).size;
        const totalLines = data.length;

        // Count matches by column
        const columnCounts = {};
        data.forEach((r) => {
          (r.matched_columns || []).forEach((col) => {
            columnCounts[col] = (columnCounts[col] || 0) + 1;
          });
        });

        // Build stats HTML
        stats.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">Query</div>
                        <div class="stat-value" style="font-size: 14px;">"${query}"</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Time</div>
                        <div class="stat-value">${time}ms</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Total Poems</div>
                        <div class="stat-value">${uniquePoems}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Total Lines</div>
                        <div class="stat-value">${totalLines}</div>
                    </div>
                    ${Object.entries(columnCounts)
                      .map(
                        ([col, count]) => `
                        <div class="stat-item">
                            <div class="stat-label">${col}</div>
                            <div class="stat-value">${count}</div>
                        </div>
                    `,
                      )
                      .join("")}
                </div>
            `;
        stats.classList.add("show");

        if (data.length === 0) {
          results.innerHTML = '<div class="result">لا توجد نتائج</div>';
          return;
        }

        results.innerHTML = data.map((r) => renderResult(r, query)).join("");
      }

      function renderResult(r, query) {
        const priorityLabels = {
          1: "Title + Line",
          2: "Title Only",
          3: "Line Only",
          4: "Metadata Only",
        };

        // Highlight poem line with metadata
        const lineHighlighted = highlightLine(
          r.poem_line_cleaned,
          r.entities,
          r.animals,
          r.places,
        );

        return `
                <div class="result">
                    <div class="result-header">
                        <div class="result-title">${highlight(r.title_cleaned, query)}</div>
                        <div style="color: #666; font-size: 12px;">P${r.priority}: ${priorityLabels[r.priority]}</div>
                    </div>
                    
                    <div class="result-line">${lineHighlighted}</div>
                    
                    <div class="result-meta">
                        poem_id: ${r.poem_id} | row_id: ${r.row_id}
                    </div>
                    
                    <div class="match-reasons">
                        ${(r.matched_columns || []).map((col) => `<span class="reason-tag">${col}</span>`).join("")}
                    </div>
                    
                    ${renderMetadata(r)}
                </div>
            `;
      }

      function highlightLine(line, entities, animals, places) {
        if (!line) return "";
        let result = line;

        // Normalize Arabic helper
        function normalizeArabic(text) {
          if (!text) return "";
          return text
            .replace(/[ًٌٍَُِّْ]/g, "") // Remove diacritics
            .replace(/[أإآٱ]/g, "ا") // Normalize alef
            .replace(/ى/g, "ي") // Alef maksura
            .replace(/ة/g, "ه") // Taa marbouta → haa
            .replace(/ؤ/g, "و") // Hamza on waw
            .replace(/ئ/g, "ي"); // Hamza on ya
        }

        // Find and highlight with normalization
        function highlightWord(word, cssClass, tooltip) {
          const wordNorm = normalizeArabic(word);
          const lineWords = result.split(" ");

          const highlighted = lineWords.map((w) => {
            if (
              normalizeArabic(w) === wordNorm ||
              normalizeArabic(w).includes(wordNorm)
            ) {
              return `<mark class="${cssClass}" title="${tooltip}">${w}</mark>`;
            }
            return w;
          });

          result = highlighted.join(" ");
        }

        // Highlight entities (from resolved_from)
        if (entities) {
          entities.forEach((e) => {
            (e.highlight_words || []).forEach((word) => {
              highlightWord(word, "entity", `${e.name} [${e.relation}]`);
            });
          });
        }

        // Highlight animals (from resolved_from)
        if (animals) {
          animals.forEach((a) => {
            (a.highlight_words || []).forEach((word) => {
              highlightWord(word, "animal", `${a.name} [${a.category}]`);
            });
          });
        }

        // Highlight places (from name)
        if (places) {
          places.forEach((p) => {
            (p.highlight_words || []).forEach((word) => {
              highlightWord(word, "place", p.type);
            });
          });
        }

        return result;
      }

      function renderMetadata(r) {
        let html = '<div class="match-details">';

        if (r.entities && r.entities.length > 0) {
          html +=
            '<div class="detail-item"><span class="detail-key">Entities:</span></div>';
          r.entities.forEach((e) => {
            html += `<div class="detail-item">
                        → <span class="detail-value">${e.name}</span> 
                        (highlight: ${e.highlight_words.join(", ")})
                        [${e.relation}]
                    </div>`;
          });
        }

        if (r.animals && r.animals.length > 0) {
          html +=
            '<div class="detail-item"><span class="detail-key">Animals:</span></div>';
          r.animals.forEach((a) => {
            html += `<div class="detail-item">
                        → <span class="detail-value">${a.name}</span> 
                        (highlight: ${a.highlight_words.join(", ")})
                        [${a.category}]
                    </div>`;
          });
        }

        if (r.places && r.places.length > 0) {
          html +=
            '<div class="detail-item"><span class="detail-key">Places:</span></div>';
          r.places.forEach((p) => {
            html += `<div class="detail-item">
                        → <span class="detail-value">${p.name}</span> 
                        (highlight: ${p.highlight_words.join(", ")})
                        [${p.type}]
                    </div>`;
          });
        }

        if (r.events && r.events.length > 0) {
          html += `<div class="detail-item">
                    <span class="detail-key">Events:</span> 
                    <span class="detail-value">${r.events.join(", ")}</span>
                </div>`;
        }

        if (r.religion && r.religion.length > 0) {
          html += `<div class="detail-item">
                    <span class="detail-key">Religion:</span> 
                    <span class="detail-value">${r.religion.join(", ")}</span>
                </div>`;
        }

        if (r.subjects && r.subjects.length > 0) {
          html += `<div class="detail-item">
                    <span class="detail-key">Subjects:</span> 
                    <span class="detail-value">${r.subjects.join(", ")}</span>
                </div>`;
        }

        if (r.sentiment) {
          html += `<div class="detail-item">
                    <span class="detail-key">Sentiment:</span> 
                    <span class="detail-value">${r.sentiment}</span>
                </div>`;
        }

        html += "</div>";
        return html;
      }

      function highlight(text, query) {
        if (!text || !query) return text || "";
        const regex = new RegExp(`(${escapeRegex(query)})`, "gi");
        return text.replace(regex, "<mark>$1</mark>");
      }

      function escapeRegex(str) {
        return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      input.focus();
    </script>
  </body>
</html>
