<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔍 بحث دلالي - ديوان فزاع</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, Arial, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        padding: 20px;
        line-height: 1.6;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #1d1d1f;
        font-size: 32px;
      }

      /* Search Box */
      .search-box {
        background: white;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        margin-bottom: 20px;
      }
      input {
        width: 100%;
        padding: 16px;
        font-size: 18px;
        background: #f5f5f7;
        border: 2px solid transparent;
        color: #1d1d1f;
        border-radius: 12px;
        margin-bottom: 16px;
        transition: all 0.2s;
      }
      input:focus {
        border-color: #007aff;
        outline: none;
        background: white;
      }
      button {
        width: 100%;
        padding: 14px;
        background: #007aff;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        font-size: 16px;
        transition: background 0.2s;
      }
      button:hover {
        background: #0051d5;
      }

      /* Stats */
      .stats {
        background: white;
        padding: 20px;
        border-radius: 16px;
        margin-bottom: 20px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        display: none;
      }
      .stats.show {
        display: block;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 16px;
      }
      .stat-item {
        text-align: center;
        padding: 12px;
        background: #f5f5f7;
        border-radius: 10px;
      }
      .stat-label {
        font-size: 12px;
        color: #86868b;
        margin-bottom: 4px;
      }
      .stat-value {
        font-size: 24px;
        font-weight: 700;
        color: #007aff;
      }

      /* Results */
      .results-container {
        display: none;
      }
      .results-container.show {
        display: block;
      }
      .poems-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 20px;
      }

      /* Poem Card */
      .poem-card {
        background: white;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        border-right: 4px solid #007aff;
        transition: all 0.2s;
        cursor: pointer;
      }
      .poem-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      }

      /* Header */
      .poem-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 2px solid #f5f5f7;
      }
      .poem-title {
        font-weight: 700;
        color: #007aff;
        font-size: 20px;
        flex: 1;
      }
      .score-badge {
        background: #007aff;
        color: white;
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        margin-right: 8px;
      }

      /* Poem Lines */
      .poem-lines {
        background: #f9f9fb;
        padding: 16px;
        border-radius: 10px;
        margin: 16px 0;
        font-size: 16px;
        line-height: 2;
        white-space: pre-wrap;
      }
      mark {
        background: #ffcc00;
        color: #1d1d1f;
        padding: 2px 4px;
        border-radius: 3px;
        font-weight: 600;
      }

      /* Poetry Info */
      .poetry-info {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
        margin: 16px 0;
        padding: 12px;
        background: #f5f5f7;
        border-radius: 10px;
        font-size: 13px;
      }
      .info-item {
        display: flex;
        flex-direction: column;
      }
      .info-label {
        color: #86868b;
        font-size: 11px;
        margin-bottom: 2px;
      }
      .info-value {
        color: #1d1d1f;
        font-weight: 600;
      }

      /* Metadata Tags */
      .metadata-section {
        margin: 12px 0;
      }
      .metadata-label {
        font-size: 12px;
        color: #86868b;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .metadata-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .meta-tag {
        background: #e8f4fd;
        color: #007aff;
        padding: 4px 10px;
        border-radius: 8px;
        font-size: 12px;
        border: 1px solid #007aff20;
      }
      .meta-tag.entity {
        background: #fff3e0;
        color: #ff9500;
        border-color: #ff950020;
      }
      .meta-tag.place {
        background: #f0f9ff;
        color: #0891b2;
        border-color: #0891b220;
      }
      .meta-tag.sentiment {
        background: #fce7f3;
        color: #ec4899;
        border-color: #ec489920;
      }

      /* Dev Info */
      .dev-info {
        margin-top: 12px;
        padding: 8px 12px;
        background: #f5f5f7;
        border-radius: 8px;
        font-size: 11px;
        color: #86868b;
        font-family: monospace;
      }

      /* Score Breakdown */
      .score-breakdown {
        margin-top: 12px;
        padding: 12px;
        background: #f9f9fb;
        border-radius: 10px;
      }
      .score-breakdown-title {
        font-size: 12px;
        color: #86868b;
        margin-bottom: 8px;
        font-weight: 600;
      }
      .score-items {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        gap: 8px;
      }
      .score-item {
        text-align: center;
        padding: 6px;
        background: white;
        border-radius: 6px;
      }
      .score-item-label {
        font-size: 10px;
        color: #86868b;
        margin-bottom: 2px;
      }
      .score-item-value {
        font-size: 14px;
        font-weight: 700;
        color: #007aff;
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #86868b;
      }
      .empty-state-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }

      /* Loading */
      .loading {
        text-align: center;
        padding: 40px;
        color: #86868b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔍 بحث دلالي في ديوان فزاع</h1>

      <div class="search-box">
        <input
          type="text"
          id="search"
          placeholder="ابحث عن قصائد... (مثال: قصائد عن محمد بن زايد والعروبة)"
          autocomplete="off"
        />
        <button id="searchBtn">🔍 بحث (Enter)</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="results-container" id="resultsContainer"></div>
    </div>

    <script>
      // const CONFIG = {
      //   N8N_WEBHOOK: "http://localhost:5678/webhook-test/Symantic_search", // Update this!
      // };
      const CONFIG = {
        N8N_WEBHOOK: "http://localhost:5678/webhook/Symantic_search", // Update this!
      };

      const input = document.getElementById("search");
      const searchBtn = document.getElementById("searchBtn");
      const stats = document.getElementById("stats");
      const resultsContainer = document.getElementById("resultsContainer");

      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") search();
      });
      searchBtn.addEventListener("click", search);

      async function search() {
        const query = input.value.trim();
        if (query.length < 2) {
          resetDisplay();
          return;
        }

        const start = performance.now();

        // Show loading
        resultsContainer.innerHTML =
          '<div class="loading">⏳ جاري البحث...</div>';
        resultsContainer.classList.add("show");

        try {
          const response = await fetch(CONFIG.N8N_WEBHOOK, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ query }),
          });

          if (!response.ok) {
            throw new Error(`API Error: ${response.status}`);
          }

          let data = await response.json();
          console.log("📦 Raw response from N8N:", JSON.stringify(data));

          // N8N wraps the edge function output in an array → unwrap it
          if (Array.isArray(data)) {
            console.log("📦 Response was array, unwrapping index [0]");
            data = data[0];
          }

          console.log("✅ Parsed data:", JSON.stringify(data));
          const elapsed = Math.round(performance.now() - start);

          displayResults(data, query, elapsed);
        } catch (error) {
          console.error("Search error:", error);
          resultsContainer.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">❌</div>
              <div>خطأ في البحث: ${error.message}</div>
            </div>
          `;
        }
      }

      function resetDisplay() {
        stats.classList.remove("show");
        resultsContainer.classList.remove("show");
        resultsContainer.innerHTML = "";
      }

      function displayResults(data, query, time) {
        console.log(
          "🎯 displayResults called | success:",
          data?.success,
          "| count:",
          data?.results?.length,
        );

        if (!data.success || !data.results || data.results.length === 0) {
          resultsContainer.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">🔍</div>
              <div>لا توجد نتائج</div>
            </div>
          `;
          return;
        }

        const results = data.results;

        // Display stats
        const avgScore = (
          results.reduce((sum, r) => sum + r.final_score, 0) / results.length
        ).toFixed(1);
        const maxScore = Math.max(...results.map((r) => r.final_score)).toFixed(
          1,
        );
        const exactMatches = results.filter(
          (r) => r.scores.exact === "YES",
        ).length;
        const metadataMatches = results.filter(
          (r) => r.matched_metadata?.length > 0,
        ).length;

        stats.innerHTML = `
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-label">⚡ وقت البحث</div>
              <div class="stat-value">${time}ms</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">📊 النتائج</div>
              <div class="stat-value">${results.length}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">🎯 متوسط النقاط</div>
              <div class="stat-value">${avgScore}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">🏆 أعلى نقاط</div>
              <div class="stat-value">${maxScore}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">✅ مطابقة تامة</div>
              <div class="stat-value">${exactMatches}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">📈 معززة</div>
              <div class="stat-value">${metadataMatches}</div>
            </div>
          </div>
        `;
        stats.classList.add("show");

        // Display poems
        resultsContainer.innerHTML = `
          <div class="poems-grid">
            ${results.map((r) => renderPoemCard(r, query)).join("")}
          </div>
        `;
        resultsContainer.classList.add("show");
      }

      function renderPoemCard(result, query) {
        const m = result.metadata;

        return `
          <div class="poem-card">
            <!-- Header -->
            <div class="poem-header">
              <div class="poem-title">${highlight(m.Title_raw || "بدون عنوان", query)}</div>
              <span class="score-badge">🏆 ${result.final_score.toFixed(0)}</span>
            </div>

            <!-- Poem Lines -->
            <div class="poem-lines">${highlight(m.Poem_line_raw || "", query)}</div>

            <!-- Poetry Technical Info -->
            ${
              m.قافية || m.البحر
                ? `
              <div class="poetry-info">
                ${
                  m.قافية
                    ? `<div class="info-item">
                  <div class="info-label">القافية</div>
                  <div class="info-value">${m.قافية}</div>
                </div>`
                    : ""
                }
                ${
                  m.روي
                    ? `<div class="info-item">
                  <div class="info-label">الروي</div>
                  <div class="info-value">${m.روي}</div>
                </div>`
                    : ""
                }
                ${
                  m.البحر
                    ? `<div class="info-item">
                  <div class="info-label">البحر</div>
                  <div class="info-value">${m.البحر}</div>
                </div>`
                    : ""
                }
                ${
                  m.وصل
                    ? `<div class="info-item">
                  <div class="info-label">الوصل</div>
                  <div class="info-value">${m.وصل}</div>
                </div>`
                    : ""
                }
                ${
                  m.حركة
                    ? `<div class="info-item">
                  <div class="info-label">الحركة</div>
                  <div class="info-value">${m.حركة}</div>
                </div>`
                    : ""
                }
              </div>
            `
                : ""
            }

            <!-- Entities -->
            ${
              m.entities?.length
                ? `
              <div class="metadata-section">
                <div class="metadata-label">👤 الشخصيات</div>
                <div class="metadata-tags">
                  ${m.entities
                    .map(
                      (e) =>
                        `<span class="meta-tag entity">${e.name || e}</span>`,
                    )
                    .join("")}
                </div>
              </div>
            `
                : ""
            }

            <!-- Subjects -->
            ${
              m.subjects?.length
                ? `
              <div class="metadata-section">
                <div class="metadata-label">🏷️ المواضيع</div>
                <div class="metadata-tags">
                  ${m.subjects
                    .slice(0, 5)
                    .map((s) => `<span class="meta-tag">${s}</span>`)
                    .join("")}
                </div>
              </div>
            `
                : ""
            }

            <!-- Places -->
            ${
              m.places?.length
                ? `
              <div class="metadata-section">
                <div class="metadata-label">📍 الأماكن</div>
                <div class="metadata-tags">
                  ${m.places
                    .map(
                      (p) =>
                        `<span class="meta-tag place">${p.name || p}</span>`,
                    )
                    .join("")}
                </div>
              </div>
            `
                : ""
            }

            <!-- Sentiments -->
            ${
              m.sentiments?.length
                ? `
              <div class="metadata-section">
                <div class="metadata-label">💭 المشاعر</div>
                <div class="metadata-tags">
                  ${m.sentiments
                    .map((s) => `<span class="meta-tag sentiment">${s}</span>`)
                    .join("")}
                </div>
              </div>
            `
                : ""
            }

            <!-- Events -->
            ${
              m.events?.length
                ? `
              <div class="metadata-section">
                <div class="metadata-label">📅 الأحداث</div>
                <div class="metadata-tags">
                  ${m.events
                    .map((e) => `<span class="meta-tag">${e}</span>`)
                    .join("")}
                </div>
              </div>
            `
                : ""
            }

            <!-- Religion -->
            ${
              m.religion?.length
                ? `
              <div class="metadata-section">
                <div class="metadata-label">☪️ الدين</div>
                <div class="metadata-tags">
                  ${m.religion
                    .map((r) => `<span class="meta-tag">${r}</span>`)
                    .join("")}
                </div>
              </div>
            `
                : ""
            }

            <!-- Animals -->
            ${
              m.animals?.length
                ? `
              <div class="metadata-section">
                <div class="metadata-label">🐪 الحيوانات</div>
                <div class="metadata-tags">
                  ${m.animals
                    .map((a) => `<span class="meta-tag">${a.name || a}</span>`)
                    .join("")}
                </div>
              </div>
            `
                : ""
            }

            <!-- Summary -->
            ${
              m.Summary
                ? `
              <div class="metadata-section">
                <div class="metadata-label">📝 الملخص</div>
                <div style="font-size: 13px; color: #666; margin-top: 4px;">
                  ${m.Summary}
                </div>
              </div>
            `
                : ""
            }

            <!-- Score Breakdown -->
            <div class="score-breakdown">
              <div class="score-breakdown-title">تحليل النقاط</div>
              <div class="score-items">
                <div class="score-item">
                  <div class="score-item-label">RRF</div>
                  <div class="score-item-value">${result.scores.rrf}</div>
                </div>
                <div class="score-item">
                  <div class="score-item-label">FTS</div>
                  <div class="score-item-value">${result.scores.fts}</div>
                </div>
                <div class="score-item">
                  <div class="score-item-label">Trigram</div>
                  <div class="score-item-value">${result.scores.trigram}</div>
                </div>
                <div class="score-item">
                  <div class="score-item-label">Semantic</div>
                  <div class="score-item-value">${result.scores.semantic}</div>
                </div>
                <div class="score-item">
                  <div class="score-item-label">Exact</div>
                  <div class="score-item-value">${result.scores.exact === "YES" ? "✅" : "❌"}</div>
                </div>
                <div class="score-item">
                  <div class="score-item-label">Metadata</div>
                  <div class="score-item-value">+${result.metadata_boost}</div>
                </div>
              </div>
            </div>

            <!-- Dev Info -->
            <div class="dev-info">
              poem_id: ${m.poem_id} | chunk_id: ${m.chunk_id} | 
              rows: ${m.Row_IDs_in_chunk} | type: ${m.chunk_type || "N/A"}
              ${result.matched_metadata?.length ? ` | matched: ${result.matched_metadata.join(", ")}` : ""}
            </div>
          </div>
        `;
      }

      function highlight(text, query) {
        if (!text || !query) return text || "";
        const words = query.split(" ").filter((w) => w.length > 2);
        let result = text;
        words.forEach((word) => {
          const regex = new RegExp(`(${escapeRegex(word)})`, "gi");
          result = result.replace(regex, "<mark>$1</mark>");
        });
        return result;
      }

      function escapeRegex(str) {
        return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      input.focus();
    </script>
  </body>
</html>
