<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔍 Full Search - Debug Mode</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #1a1a1a;
        color: white;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #00ff00;
      }

      /* Search Box */
      .search-box {
        background: #2a2a2a;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 20px;
      }

      input {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        background: #1a1a1a;
        border: 2px solid #444;
        color: white;
        border-radius: 8px;
        margin-bottom: 15px;
      }
      input:focus {
        border-color: #00ff00;
        outline: none;
      }

      /* Column Toggles */
      .toggles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-bottom: 15px;
      }

      .toggle {
        background: #333;
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        text-align: center;
        border: 2px solid #444;
        transition: all 0.2s;
        user-select: none;
      }

      .toggle.active {
        background: #00ff00;
        color: #000;
        border-color: #00ff00;
        font-weight: bold;
      }

      .toggle:hover {
        border-color: #00ff00;
      }

      /* Stats */
      .stats {
        background: #2a2a2a;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
      }
      .stats.show {
        display: block;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }

      .stat-item {
        background: #333;
        padding: 10px;
        border-radius: 6px;
        text-align: center;
      }

      .stat-label {
        font-size: 11px;
        color: #999;
        margin-bottom: 5px;
      }

      .stat-value {
        font-size: 20px;
        color: #00ff00;
        font-weight: bold;
      }

      /* Results */
      .result {
        background: #2a2a2a;
        padding: 15px;
        margin: 12px 0;
        border-radius: 8px;
        border-left: 4px solid #00ff00;
      }

      .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .result-title {
        font-weight: bold;
        color: #00ff00;
        font-size: 16px;
      }

      .priority-badge {
        background: #444;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 11px;
        color: #00ff00;
      }

      .result-line {
        color: #ccc;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 10px;
      }

      .result-meta {
        color: #666;
        font-size: 12px;
        margin-bottom: 10px;
      }

      /* Match Reasons */
      .match-reasons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .reason-tag {
        background: #333;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        border: 1px solid #555;
      }

      .reason-tag.title {
        border-color: #ff6b6b;
        color: #ff6b6b;
      }
      .reason-tag.line {
        border-color: #4ecdc4;
        color: #4ecdc4;
      }
      .reason-tag.entities {
        border-color: #ffe66d;
        color: #ffe66d;
      }
      .reason-tag.places {
        border-color: #95e1d3;
        color: #95e1d3;
      }
      .reason-tag.events {
        border-color: #f38181;
        color: #f38181;
      }
      .reason-tag.religion {
        border-color: #aa96da;
        color: #aa96da;
      }
      .reason-tag.subjects {
        border-color: #fcbad3;
        color: #fcbad3;
      }
      .reason-tag.sentiments {
        border-color: #a8e6cf;
        color: #a8e6cf;
      }

      /* Match Details */
      .match-details {
        background: #1a1a1a;
        padding: 10px;
        border-radius: 6px;
        margin-top: 8px;
        font-size: 12px;
        font-family: monospace;
      }

      .detail-item {
        padding: 4px 0;
        color: #999;
      }

      .detail-key {
        color: #00ff00;
        font-weight: bold;
      }

      .detail-value {
        color: #fff;
      }

      mark {
        background: #ffeb3b;
        color: #000;
        padding: 2px 4px;
        border-radius: 2px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔍 Full Search - Debug Mode</h1>

      <div class="search-box">
        <input
          type="text"
          id="search"
          placeholder="ابحث... (مثال: ابو خالد، حبيبتي، القيادة)"
          autocomplete="off"
        />

        <div class="toggles">
          <div class="toggle active" data-column="title">📄 Title</div>
          <div class="toggle active" data-column="line">📝 Line</div>
          <div class="toggle" data-column="entities">👤 Entities</div>
          <div class="toggle" data-column="places">📍 Places</div>
          <div class="toggle" data-column="events">📅 Events</div>
          <div class="toggle" data-column="religion">☪️ Religion</div>
          <div class="toggle" data-column="subjects">🏷️ Subjects</div>
          <div class="toggle" data-column="sentiments">💭 Sentiments</div>
        </div>

        <button
          id="searchBtn"
          style="
            width: 100%;
            padding: 12px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
          "
        >
          🔍 بحث كامل (Enter)
        </button>
      </div>

      <div class="stats" id="stats"></div>
      <div id="results"></div>
    </div>

    <script>
      const CONFIG = {
        SUPABASE_URL: "https://qnoqkbndjgbtxxnxezly.supabase.co",
        SUPABASE_KEY:
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFub3FrYm5kamdidHh4bnhlemx5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2OTY2OTIyMywiZXhwIjoyMDg1MjQ1MjIzfQ.eBtro9T_rC_FHI2CcShtpAv8uwHBkSCw8Ivul4szKE8",
      };

      const input = document.getElementById("search");
      const searchBtn = document.getElementById("searchBtn");
      const results = document.getElementById("results");
      const stats = document.getElementById("stats");
      const toggles = document.querySelectorAll(".toggle");

      let enabledColumns = {
        title: true,
        line: true,
        entities: false,
        places: false,
        events: false,
        religion: false,
        subjects: false,
        sentiments: false,
      };

      // Toggle columns
      toggles.forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const column = toggle.dataset.column;
          enabledColumns[column] = !enabledColumns[column];
          toggle.classList.toggle("active");
        });
      });

      // Search on Enter or button click
      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") search();
      });
      searchBtn.addEventListener("click", search);

      async function search() {
        const query = input.value.trim();

        if (query.length < 2) {
          results.innerHTML = "";
          stats.classList.remove("show");
          return;
        }

        const start = performance.now();

        try {
          const requestBody = {
            search_query: query,
            enabled_columns: enabledColumns,
            result_limit: 100,
          };

          console.log("Request:", requestBody);

          const response = await fetch(
            `${CONFIG.SUPABASE_URL}/rest/v1/rpc/full_search`,
            {
              method: "POST",
              headers: {
                apikey: CONFIG.SUPABASE_KEY,
                Authorization: `Bearer ${CONFIG.SUPABASE_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(requestBody),
            },
          );

          const data = await response.json();
          console.log("Response:", data);

          const elapsed = Math.round(performance.now() - start);

          // Check if response is an error
          if (!response.ok || data.error || data.message) {
            console.error("API Error:", data);
            results.innerHTML = `
                        <div class="result" style="border-color: #f44;">
                            <div class="result-title">❌ خطأ في البحث</div>
                            <div class="match-details">
                                <div class="detail-item">Status: ${response.status}</div>
                                <div class="detail-item">Error: ${data.message || data.error || "Unknown error"}</div>
                                <div class="detail-item">Hint: ${data.hint || "Check console for details"}</div>
                            </div>
                        </div>
                    `;
            return;
          }

          // Check if data is array
          if (!Array.isArray(data)) {
            console.error("Expected array, got:", typeof data, data);
            results.innerHTML = `
                        <div class="result" style="border-color: #f44;">
                            <div class="result-title">❌ خطأ في البيانات</div>
                            <div class="match-details">
                                <div class="detail-item">Expected array, got: ${typeof data}</div>
                                <div class="detail-item">Data: ${JSON.stringify(data).substring(0, 200)}</div>
                            </div>
                        </div>
                    `;
            return;
          }

          displayResults(data, query, elapsed);
        } catch (error) {
          console.error("Search error:", error);
          results.innerHTML = `
                    <div class="result" style="border-color: #f44;">
                        <div class="result-title">❌ خطأ في الاتصال</div>
                        <div class="match-details">
                            <div class="detail-item">${error.message}</div>
                        </div>
                    </div>
                `;
        }
      }

      function displayResults(data, query, time) {
        // Calculate stats
        const uniquePoems = new Set(data.map((r) => r.poem_id)).size;
        const totalLines = data.length;

        const matchedBy = {};
        data.forEach((r) => {
          const columns = r.match_reasons?.matched_columns || [];
          columns.forEach((col) => {
            matchedBy[col] = (matchedBy[col] || 0) + 1;
          });
        });

        // Display stats
        stats.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">Query</div>
                        <div class="stat-value">"${query}"</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Time</div>
                        <div class="stat-value">${time}ms</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Total Poems</div>
                        <div class="stat-value">${uniquePoems}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Total Lines</div>
                        <div class="stat-value">${totalLines}</div>
                    </div>
                    ${Object.entries(matchedBy)
                      .map(
                        ([col, count]) => `
                        <div class="stat-item">
                            <div class="stat-label">${col}</div>
                            <div class="stat-value">${count}</div>
                        </div>
                    `,
                      )
                      .join("")}
                </div>
            `;
        stats.classList.add("show");

        if (data.length === 0) {
          results.innerHTML = '<div class="result">لا توجد نتائج</div>';
          return;
        }

        // Display results
        results.innerHTML = data.map((r) => renderResult(r, query)).join("");
      }

      function renderResult(r, query) {
        const reasons = r.match_reasons || {};
        const columns = reasons.matched_columns || [];

        const priorityLabels = {
          1: "Title + Line",
          2: "Title Only",
          3: "Line Only",
          4: "Metadata Only",
        };

        return `
                <div class="result">
                    <div class="result-header">
                        <div class="result-title">${highlight(r.title_cleaned, query)}</div>
                        <div class="priority-badge">P${r.priority}: ${priorityLabels[r.priority]}</div>
                    </div>
                    
                    <div class="result-line">${highlight(r.poem_line_cleaned, query)}</div>
                    
                    <div class="result-meta">
                        poem_id: ${r.poem_id} | row_id: ${r.row_id}
                    </div>
                    
                    <div class="match-reasons">
                        ${columns.map((col) => `<span class="reason-tag ${col}">${col}</span>`).join("")}
                    </div>
                    
                    ${renderMatchDetails(reasons)}
                </div>
            `;
      }

      function renderMatchDetails(reasons) {
        let html = '<div class="match-details">';

        // Entities
        if (reasons.entities && reasons.entities.length > 0) {
          html +=
            '<div class="detail-item"><span class="detail-key">Entities:</span></div>';
          reasons.entities.forEach((e) => {
            html += `<div class="detail-item">
                        → <span class="detail-value">${e.semantic_name}</span> 
                        (matched: <mark>${e.matched_alias || e.semantic_name}</mark>)
                        ${e.relation ? `[${e.relation}]` : ""}
                    </div>`;
          });
        }

        // Places
        if (reasons.places && reasons.places.length > 0) {
          html +=
            '<div class="detail-item"><span class="detail-key">Places:</span></div>';
          reasons.places.forEach((p) => {
            html += `<div class="detail-item">
                        → <span class="detail-value">${p.name}</span> 
                        (matched: <mark>${p.matched_field}</mark>)
                        [${p.type}]
                    </div>`;
          });
        }

        // Events
        if (reasons.events && reasons.events.length > 0) {
          html += `<div class="detail-item">
                    <span class="detail-key">Events:</span> 
                    <span class="detail-value">${reasons.events.map((e) => `<mark>${e}</mark>`).join(", ")}</span>
                </div>`;
        }

        // Religion
        if (reasons.religion && reasons.religion.length > 0) {
          html += `<div class="detail-item">
                    <span class="detail-key">Religion:</span> 
                    <span class="detail-value">${reasons.religion.map((r) => `<mark>${r}</mark>`).join(", ")}</span>
                </div>`;
        }

        // Subjects
        if (reasons.subjects && reasons.subjects.length > 0) {
          html += `<div class="detail-item">
                    <span class="detail-key">Subjects:</span> 
                    <span class="detail-value">${reasons.subjects.map((s) => `<mark>${s}</mark>`).join(", ")}</span>
                </div>`;
        }

        // Sentiment
        if (reasons.sentiment) {
          html += `<div class="detail-item">
                    <span class="detail-key">Sentiment:</span> 
                    <span class="detail-value"><mark>${reasons.sentiment}</mark></span>
                </div>`;
        }

        html += "</div>";
        return html;
      }

      function highlight(text, query) {
        if (!text || !query) return text || "";
        const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const regex = new RegExp(`(${escaped})`, "gi");
        return text.replace(regex, "<mark>$1</mark>");
      }

      input.focus();
    </script>
  </body>
</html>
