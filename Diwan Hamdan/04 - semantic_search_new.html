<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔍 البحث الذكي - ديوان فزاع</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        line-height: 1.6;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 30px;
        color: white;
      }
      h1 {
        font-size: 48px;
        font-weight: 800;
        margin-bottom: 10px;
        text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
      }
      .subtitle {
        font-size: 18px;
        opacity: 0.9;
      }

      /* Search Box */
      .search-box {
        background: white;
        padding: 32px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        margin-bottom: 24px;
      }

      input {
        width: 100%;
        padding: 18px 24px;
        font-size: 18px;
        background: #f5f5f7;
        border: 3px solid transparent;
        color: #1d1d1f;
        border-radius: 14px;
        margin-bottom: 16px;
        transition: all 0.3s;
        font-family: inherit;
      }

      input:focus {
        border-color: #667eea;
        outline: none;
        background: white;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      }

      button {
        width: 100%;
        padding: 18px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 14px;
        font-weight: 700;
        cursor: pointer;
        font-size: 18px;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }

      /* Stats */
      .stats {
        background: white;
        padding: 24px;
        border-radius: 20px;
        margin-bottom: 24px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        display: none;
      }

      .stats.show {
        display: block;
        animation: slideDown 0.4s ease-out;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 16px;
      }

      .stat-item {
        text-align: center;
        padding: 16px;
        background: linear-gradient(135deg, #f5f5f7 0%, #e8e8ed 100%);
        border-radius: 12px;
        transition: transform 0.2s;
      }

      .stat-item:hover {
        transform: scale(1.05);
      }

      .stat-label {
        font-size: 12px;
        color: #86868b;
        margin-bottom: 6px;
        font-weight: 600;
      }

      .stat-value {
        font-size: 28px;
        font-weight: 800;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Filter Badge */
      .filter-badge {
        background: white;
        padding: 16px 24px;
        border-radius: 20px;
        margin-bottom: 20px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        display: none;
        align-items: center;
        justify-content: space-between;
      }

      .filter-badge.show {
        display: flex;
      }

      .filter-text {
        font-size: 16px;
        font-weight: 600;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .clear-filter {
        background: #ff3b30;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
      }

      .clear-filter:hover {
        background: #d32f2f;
        transform: scale(1.05);
      }

      /* Results */
      .results-container {
        display: none;
      }
      .results-container.show {
        display: block;
        animation: fadeIn 0.5s ease-out;
      }

      .poems-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 24px;
      }

      /* Poem Card */
      .poem-card {
        background: white;
        padding: 28px;
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        border-right: 6px solid transparent;
        border-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%) 1;
        transition: all 0.3s;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }

      .poem-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        transform: scaleX(0);
        transition: transform 0.3s;
      }

      .poem-card:hover::before {
        transform: scaleX(1);
      }
      .poem-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 40px rgba(102, 126, 234, 0.3);
      }

      /* Header */
      .poem-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 2px solid #f5f5f7;
      }

      .poem-title {
        font-weight: 800;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-size: 22px;
        flex: 1;
        line-height: 1.4;
      }

      .score-badge {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        margin-right: 12px;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }

      /* Summary */
      .summary-section {
        background: linear-gradient(135deg, #fff9e6 0%, #ffecb3 100%);
        padding: 16px;
        border-radius: 12px;
        margin: 16px 0;
        border-right: 4px solid #ffcc00;
      }

      .summary-label {
        font-size: 11px;
        color: #856404;
        font-weight: 700;
        margin-bottom: 6px;
        text-transform: uppercase;
      }

      .summary-text {
        font-size: 15px;
        color: #1d1d1f;
        line-height: 1.9;
      }

      /* Poem Lines */
      .poem-lines {
        background: linear-gradient(135deg, #f9f9fb 0%, #f0f0f5 100%);
        padding: 20px;
        border-radius: 12px;
        margin: 16px 0;
        font-size: 17px;
        line-height: 2.2;
        white-space: pre-wrap;
        border-right: 3px solid #e0e0e8;
      }

      /* Smart highlighting - only matched words */
      mark {
        background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
        color: #1d1d1f;
        padding: 2px 5px;
        border-radius: 4px;
        font-weight: 600;
        box-shadow: 0 2px 6px rgba(255, 215, 0, 0.3);
      }

      /* Poetry Info */
      .poetry-info {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 12px;
        margin: 16px 0;
        padding: 16px;
        background: linear-gradient(135deg, #f5f5f7 0%, #e8e8ed 100%);
        border-radius: 12px;
      }

      .info-item {
        text-align: center;
        padding: 8px;
        background: white;
        border-radius: 8px;
      }
      .info-label {
        color: #86868b;
        font-size: 10px;
        margin-bottom: 4px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .info-value {
        color: #1d1d1f;
        font-weight: 700;
        font-size: 14px;
      }

      /* Metadata Section with Clickable Tags */
      .metadata-section {
        margin: 16px 0;
      }

      .metadata-label {
        font-size: 12px;
        color: #86868b;
        margin-bottom: 8px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .metadata-values {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .meta-value-item {
        display: inline-block;
        background: #e8f4fd;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        border: 2px solid transparent;
      }

      .meta-value-item:hover {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }

      .meta-value-item.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-color: #ffcc00;
        box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.3);
      }

      .meta-value-item.entity {
        background: #fff3e0;
        color: #ff9500;
      }
      .meta-value-item.entity:hover {
        background: linear-gradient(135deg, #ff9500 0%, #ff6b00 100%);
        color: white;
      }
      .meta-value-item.entity.active {
        background: linear-gradient(135deg, #ff9500 0%, #ff6b00 100%);
        color: white;
      }

      .meta-value-item.place {
        background: #f0f9ff;
        color: #0891b2;
      }
      .meta-value-item.place:hover {
        background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%);
        color: white;
      }
      .meta-value-item.place.active {
        background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%);
        color: white;
      }

      .meta-value-item.sentiment {
        background: #fce7f3;
        color: #ec4899;
      }
      .meta-value-item.sentiment:hover {
        background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
        color: white;
      }
      .meta-value-item.sentiment.active {
        background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
        color: white;
      }

      /* Score Breakdown */
      .score-breakdown {
        margin-top: 16px;
        padding: 16px;
        background: linear-gradient(135deg, #f9f9fb 0%, #f0f0f5 100%);
        border-radius: 12px;
      }

      .score-breakdown-title {
        font-size: 12px;
        color: #86868b;
        margin-bottom: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .score-items {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        gap: 10px;
      }

      .score-item {
        text-align: center;
        padding: 10px;
        background: white;
        border-radius: 8px;
        transition: transform 0.2s;
      }

      .score-item:hover {
        transform: translateY(-2px);
      }

      .score-item-label {
        font-size: 10px;
        color: #86868b;
        margin-bottom: 4px;
        font-weight: 600;
      }

      .score-item-value {
        font-size: 16px;
        font-weight: 800;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Dev Info */
      .dev-info {
        margin-top: 16px;
        padding: 10px 14px;
        background: #f5f5f7;
        border-radius: 8px;
        font-size: 11px;
        color: #86868b;
        font-family: "Courier New", monospace;
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: white;
      }
      .empty-state-icon {
        font-size: 64px;
        margin-bottom: 20px;
        animation: bounce 2s infinite;
      }
      .empty-state-text {
        font-size: 20px;
        font-weight: 600;
      }

      /* Loading */
      .loading {
        text-align: center;
        padding: 60px 20px;
        color: white;
      }
      .loading-spinner {
        font-size: 48px;
        animation: spin 1s linear infinite;
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      /* Responsive */
      @media (max-width: 768px) {
        h1 {
          font-size: 32px;
        }
        .poems-grid {
          grid-template-columns: 1fr;
        }
        .stats-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🔍 البحث الذكي</h1>
        <div class="subtitle">
          ديوان صاحب السمو الشيخ حمدان بن محمد بن راشد آل مكتوم
        </div>
      </div>

      <div class="search-box">
        <input
          type="text"
          id="search"
          placeholder="ابحث عن قصائد..."
          autocomplete="off"
        />
        <button id="searchBtn">🔍 بحث (Enter)</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="filter-badge" id="filterBadge">
        <div class="filter-text" id="filterText"></div>
        <button class="clear-filter" onclick="clearFilter()">
          ✕ إلغاء التصفية
        </button>
      </div>

      <div class="results-container" id="resultsContainer"></div>
    </div>

    <script>
      const CONFIG = {
        N8N_WEBHOOK:
          "https://n8n.devinprocess.com/webhook-test/Symantic_search",
      };

      const input = document.getElementById("search");
      const searchBtn = document.getElementById("searchBtn");
      const stats = document.getElementById("stats");
      const filterBadge = document.getElementById("filterBadge");
      const filterText = document.getElementById("filterText");
      const resultsContainer = document.getElementById("resultsContainer");

      let allResults = [];
      let currentQuery = "";
      let activeFilter = null; // {type: 'entity', name: 'زايد'}

      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") search();
      });
      searchBtn.addEventListener("click", search);

      async function search() {
        const query = input.value.trim();
        if (query.length < 2) {
          stats.classList.remove("show");
          filterBadge.classList.remove("show");
          resultsContainer.classList.remove("show");
          allResults = [];
          activeFilter = null;
          return;
        }

        currentQuery = query;
        activeFilter = null; // Reset filter on new search
        const start = performance.now();

        resultsContainer.innerHTML = `
          <div class="loading">
            <div class="loading-spinner">⏳</div>
            <div style="margin-top: 16px; font-size: 18px;">جاري البحث...</div>
          </div>
        `;
        resultsContainer.classList.add("show");
        filterBadge.classList.remove("show");

        try {
          const response = await fetch(CONFIG.N8N_WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query }),
          });

          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          let data = await response.json();

          // Handle array-wrapped response
          if (Array.isArray(data)) data = data[0];

          const elapsed = Math.round(performance.now() - start);

          if (data && data.success && data.results) {
            // Store results and calculate relative scores
            allResults = data.results;

            // Calculate relative scores with robust type conversion
            if (allResults.length > 0) {
              // Step 1: Convert all final_score values to numbers
              allResults = allResults.map((r) => ({
                ...r,
                final_score: Number(r.final_score) || 0,
              }));

              // Step 2: Calculate maxScore from valid numbers only
              const validScores = allResults
                .map((r) => r.final_score)
                .filter((score) => !isNaN(score) && score > 0);

              const maxScore =
                validScores.length > 0 ? Math.max(...validScores) : 1;

              // Step 3: Unconditionally assign relative_score to every result
              allResults = allResults.map((r) => ({
                ...r,
                relative_score:
                  maxScore > 0
                    ? Math.round((r.final_score / maxScore) * 100)
                    : 0,
              }));
            }

            displayResults(elapsed);
          } else {
            throw new Error("No results");
          }
        } catch (error) {
          console.error("Search error:", error);
          resultsContainer.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">❌</div>
              <div class="empty-state-text">خطأ: ${error.message}</div>
            </div>
          `;
        }
      }

      function displayResults(time) {
        // Apply filtering
        let filtered = allResults;

        if (activeFilter) {
          filtered = allResults.filter((r) => {
            const m = r.metadata || {};
            if (activeFilter.type === "entity") {
              return (
                Array.isArray(m.entities) &&
                m.entities.some((e) => {
                  const name = typeof e === "string" ? e : e.name || "";
                  return name === activeFilter.name;
                })
              );
            } else if (activeFilter.type === "place") {
              return (
                Array.isArray(m.places) &&
                m.places.some((p) => {
                  const name = typeof p === "string" ? p : p.name || "";
                  return name === activeFilter.name;
                })
              );
            } else if (activeFilter.type === "subject") {
              return (
                Array.isArray(m.subjects) &&
                m.subjects.some((s) => {
                  const name = typeof s === "string" ? s : s.subject || "";
                  return name === activeFilter.name;
                })
              );
            } else if (activeFilter.type === "sentiment") {
              return (
                Array.isArray(m.sentiments) &&
                m.sentiments.some((s) => {
                  const name = typeof s === "string" ? s : s.sentiment || "";
                  return name === activeFilter.name;
                })
              );
            }
            return true;
          });
        }

        if (filtered.length === 0) {
          resultsContainer.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">🔍</div>
              <div class="empty-state-text">لا توجد نتائج${activeFilter ? " بهذا التصفية" : ""}</div>
            </div>
          `;
          return;
        }

        const avgScore = (
          filtered.reduce((sum, r) => sum + (r.final_score || 0), 0) /
          filtered.length
        ).toFixed(1);
        const maxScore = Math.max(
          ...filtered.map((r) => r.final_score || 0),
        ).toFixed(1);
        const maxRelative = Math.max(
          ...filtered.map((r) => r.relative_score || 0),
        );
        const minRelative = Math.min(
          ...filtered.map((r) => r.relative_score || 0),
        );
        const exactMatches = filtered.filter(
          (r) => r.scores?.exact === "YES",
        ).length;
        const summaryMatches = filtered.filter((r) =>
          r.matched_metadata?.includes("summary"),
        ).length;

        stats.innerHTML = `
          <div class="stats-grid">
            <div class="stat-item"><div class="stat-label">⚡ وقت البحث</div><div class="stat-value">${time}ms</div></div>
            <div class="stat-item"><div class="stat-label">📊 النتائج</div><div class="stat-value">${filtered.length}</div></div>
            <div class="stat-item"><div class="stat-label">🎯 متوسط</div><div class="stat-value">${avgScore}</div></div>
            <div class="stat-item"><div class="stat-label">🏆 أعلى</div><div class="stat-value">${maxScore}</div></div>
            <div class="stat-item" style="background: #e8f5e9;"><div class="stat-label" style="color: #34c759;">📊 نطاق</div><div class="stat-value" style="color: #34c759; font-size: 16px;">${minRelative}-${maxRelative}%</div></div>
            <div class="stat-item"><div class="stat-label">✅ مطابقة</div><div class="stat-value">${exactMatches}</div></div>
            <div class="stat-item"><div class="stat-label">📝 ملخصات</div><div class="stat-value">${summaryMatches}</div></div>
          </div>
        `;
        stats.classList.add("show");

        // Show filter badge
        if (activeFilter) {
          const typeLabels = {
            entity: "👤 الشخصية",
            place: "📍 المكان",
            subject: "🏷️ الموضوع",
            sentiment: "💭 المشاعر",
          };
          filterText.textContent = `${typeLabels[activeFilter.type]}: ${activeFilter.name}`;
          filterBadge.classList.add("show");
        } else {
          filterBadge.classList.remove("show");
        }

        resultsContainer.innerHTML = `
          <div class="poems-grid">
            ${filtered.map((r) => renderPoemCard(r, currentQuery)).join("")}
          </div>
        `;
        resultsContainer.classList.add("show");
      }

      function filterByMetadata(type, name) {
        if (
          activeFilter &&
          activeFilter.type === type &&
          activeFilter.name === name
        ) {
          // Toggle off
          activeFilter = null;
        } else {
          // Set new filter
          activeFilter = { type, name };
        }

        // Re-render without new search
        const lastTime = parseInt(stats.textContent.match(/\d+ms/)?.[0] || "0");
        displayResults(lastTime);
      }

      function clearFilter() {
        activeFilter = null;
        const lastTime = parseInt(stats.textContent.match(/\d+ms/)?.[0] || "0");
        displayResults(lastTime);
      }

      function renderPoemCard(result, query) {
        const m = result.metadata || {};

        return `
          <div class="poem-card">
            <div class="poem-header">
              <div class="poem-title">${smartHighlight(m.Title_raw || "بدون عنوان", query)}</div>
              <div style="display: flex; gap: 6px;">
                <span class="score-badge" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">${result.relative_score || 0}%</span>
                <span class="score-badge">🏆 ${(result.final_score || 0).toFixed(0)}</span>
              </div>
            </div>

            ${
              m.Summary
                ? `
              <div class="summary-section">
                <div class="summary-label">📝 ملخص القصيدة</div>
                <div class="summary-text">${smartHighlight(m.Summary, query)}</div>
              </div>
            `
                : ""
            }

            <div class="poem-lines">${smartHighlight(m.Poem_line_raw || "", query)}</div>

            ${
              m.قافية || m.البحر
                ? `
              <div class="poetry-info">
                ${m.قافية ? `<div class="info-item"><div class="info-label">القافية</div><div class="info-value">${m.قافية}</div></div>` : ""}
                ${m.روي ? `<div class="info-item"><div class="info-label">الروي</div><div class="info-value">${m.روي}</div></div>` : ""}
                ${m.البحر ? `<div class="info-item"><div class="info-label">البحر</div><div class="info-value">${m.البحر}</div></div>` : ""}
                ${m.category ? `<div class="info-item"><div class="info-label">الفئة</div><div class="info-value">${m.category}</div></div>` : ""}
              </div>
            `
                : ""
            }

            ${renderMetadataSection(m, "entities", "👤 الشخصيات", "entity")}
            ${renderMetadataSection(m, "places", "📍 الأماكن", "place")}
            ${renderMetadataSection(m, "subjects", "🏷️ المواضيع", "subject")}
            ${renderMetadataSection(m, "sentiments", "💭 المشاعر", "sentiment")}

            <div class="score-breakdown">
              <div class="score-breakdown-title">تحليل النقاط</div>
              <div class="score-items">
                <div class="score-item"><div class="score-item-label">RRF</div><div class="score-item-value">${result.scores?.rrf || "0"}</div></div>
                <div class="score-item"><div class="score-item-label">FTS</div><div class="score-item-value">${result.scores?.fts || "0"}</div></div>
                <div class="score-item"><div class="score-item-label">Trigram</div><div class="score-item-value">${result.scores?.trigram || "0"}</div></div>
                <div class="score-item"><div class="score-item-label">Semantic</div><div class="score-item-value">${result.scores?.semantic || "0"}</div></div>
                <div class="score-item"><div class="score-item-label">Sem×5</div><div class="score-item-value">+${(result.semantic_boost || 0).toFixed(0)}</div></div>
                <div class="score-item"><div class="score-item-label">Exact</div><div class="score-item-value">${result.scores?.exact === "YES" ? "✅" : "❌"}</div></div>
                <div class="score-item"><div class="score-item-label">Metadata</div><div class="score-item-value">+${result.metadata_boost || 0}</div></div>
              </div>
            </div>

            <div class="dev-info">
              poem: ${m.poem_id} | chunk: ${m.chunk_id}
              ${result.matched_metadata?.length ? ` | ${result.matched_metadata.slice(0, 3).join(", ")}` : ""}
            </div>
          </div>
        `;
      }

      // Render metadata with clickable filtering
      function renderMetadataSection(metadata, field, label, className) {
        const items = metadata[field];
        if (!Array.isArray(items) || items.length === 0) return "";

        const values = items
          .slice(0, 8)
          .map((item) => {
            let displayValue = "";
            if (typeof item === "string") {
              displayValue = item;
            } else if (item && typeof item === "object") {
              displayValue =
                item.name ||
                item.subject ||
                item.event ||
                item.religion ||
                item.sentiment ||
                "";
            }

            if (!displayValue) return "";

            const isActive =
              activeFilter &&
              activeFilter.type === className &&
              activeFilter.name === displayValue;
            const activeClass = isActive ? "active" : "";

            return `<span class="meta-value-item ${className} ${activeClass}" 
                       onclick='filterByMetadata("${className}", "${displayValue.replace(/'/g, "\\'")}"); event.stopPropagation();'>
                    ${displayValue}
                  </span>`;
          })
          .filter((v) => v)
          .join("");

        if (!values) return "";

        return `
          <div class="metadata-section">
            <div class="metadata-label">${label}</div>
            <div class="metadata-values">${values}</div>
          </div>
        `;
      }

      // Smart highlighting - only highlight individual query words
      function smartHighlight(text, query) {
        if (!text || !query) return text || "";

        // Split query into meaningful words (filter out short words)
        const words = query.split(/\s+/).filter((w) => w.length > 2);
        if (words.length === 0) return text;

        let result = text;

        // Highlight each word separately
        words.forEach((word) => {
          const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          // Use word boundary-aware regex
          const regex = new RegExp(`(${escaped})`, "gi");
          result = result.replace(regex, "<mark>$1</mark>");
        });

        return result;
      }

      input.focus();
    </script>
  </body>
</html>
