<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔍 Smart Search - Working</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #1a1a1a;
        color: white;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #00ff00;
      }

      .search-box {
        background: #2a2a2a;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 20px;
      }
      input {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        background: #1a1a1a;
        border: 2px solid #444;
        color: white;
        border-radius: 8px;
        margin-bottom: 15px;
      }
      input:focus {
        border-color: #00ff00;
        outline: none;
      }

      .toggles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-bottom: 15px;
      }
      .toggle {
        background: #333;
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        text-align: center;
        border: 2px solid #444;
        transition: all 0.2s;
        user-select: none;
      }
      .toggle.active {
        background: #00ff00;
        color: #000;
        border-color: #00ff00;
        font-weight: bold;
      }
      .toggle:hover {
        border-color: #00ff00;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #00ff00;
        color: #000;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        font-size: 16px;
      }

      .stats {
        background: #2a2a2a;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 13px;
        color: #999;
      }

      .section-title {
        color: #00ff00;
        font-size: 18px;
        font-weight: bold;
        margin: 20px 0 15px 0;
        padding: 10px;
        background: #2a2a2a;
        border-radius: 8px;
      }

      /* Carousel */
      .carousel {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding: 10px 0;
        scroll-snap-type: x mandatory;
      }
      .carousel::-webkit-scrollbar {
        height: 8px;
      }
      .carousel::-webkit-scrollbar-track {
        background: #2a2a2a;
      }
      .carousel::-webkit-scrollbar-thumb {
        background: #00ff00;
        border-radius: 4px;
      }

      .carousel-item {
        min-width: 280px;
        background: #2a2a2a;
        padding: 20px;
        border-radius: 12px;
        border: 3px solid #00ff00;
        scroll-snap-align: start;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .carousel-item:hover {
        transform: scale(1.05);
      }
      .carousel-title {
        font-weight: bold;
        color: #00ff00;
        font-size: 16px;
        margin-bottom: 10px;
      }
      .carousel-line {
        color: #999;
        font-size: 14px;
      }

      /* Results */
      .result {
        background: #2a2a2a;
        padding: 15px;
        margin: 12px 0;
        border-radius: 8px;
        border-left: 4px solid #4ecdc4;
      }
      .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .result-title {
        font-weight: bold;
        color: #4ecdc4;
        font-size: 16px;
      }
      .priority-badge {
        background: #444;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 11px;
        color: #4ecdc4;
      }
      .result-line {
        color: #ccc;
        font-size: 15px;
        line-height: 1.8;
        margin: 10px 0;
      }
      .result-meta {
        color: #666;
        font-size: 12px;
        margin-top: 10px;
      }

      mark {
        background: #ffeb3b;
        color: #000;
        padding: 2px 4px;
        border-radius: 2px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔍 Smart Search - Working Version</h1>

      <div class="search-box">
        <input
          type="text"
          id="search"
          placeholder="ابحث... (1-3 كلمات: أي كلمة | 4+ كلمات: عبارة كاملة)"
          autocomplete="off"
        />

        <div class="toggles">
          <div class="toggle active" data-column="title">📄 Title</div>
          <div class="toggle active" data-column="line">📝 Line</div>
          <div class="toggle" data-column="entities">👤 Entities</div>
          <div class="toggle" data-column="places">📍 Places</div>
          <div class="toggle" data-column="events">📅 Events</div>
          <div class="toggle" data-column="religion">☪️ Religion</div>
          <div class="toggle" data-column="subjects">🏷️ Subjects</div>
          <div class="toggle" data-column="animals">🦁 Animals</div>
          <div class="toggle" data-column="sentiments">💭 Sentiments</div>
        </div>

        <div style="margin: 15px 0">
          <div
            class="toggle"
            id="showTitleMatches"
            style="
              background: #444;
              padding: 12px;
              border-radius: 6px;
              cursor: pointer;
              text-align: center;
              border: 2px solid #666;
              transition: all 0.2s;
              user-select: none;
            "
          >
            🎯 Show Title Matches in Carousel
          </div>
        </div>

        <button id="searchBtn">🔍 بحث (Enter)</button>
      </div>

      <div class="stats" id="stats" style="display: none"></div>

      <div id="carouselSection" style="display: none">
        <div class="section-title">
          🎯 قصائد: العنوان فقط يطابق البحث (carousel - swipe)
        </div>
        <div class="carousel" id="carousel"></div>
      </div>

      <div id="resultsSection" style="display: none">
        <div class="section-title">📝 الأبيات التي تطابق البحث</div>
        <div id="results"></div>
      </div>
    </div>

    <script>
      const CONFIG = {
        SUPABASE_URL: "http://localhost:8000",
        SUPABASE_KEY:
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE",
      };

      const input = document.getElementById("search");
      const searchBtn = document.getElementById("searchBtn");
      const stats = document.getElementById("stats");
      const carousel = document.getElementById("carousel");
      const carouselSection = document.getElementById("carouselSection");
      const results = document.getElementById("results");
      const resultsSection = document.getElementById("resultsSection");
      const toggles = document.querySelectorAll(".toggle");
      const showTitleMatchesToggle =
        document.getElementById("showTitleMatches");

      let enabledColumns = {
        title: true,
        line: true,
        entities: false,
        places: false,
        events: false,
        religion: false,
        subjects: false,
        animals: false,
        sentiments: false,
      };

      let showTitleMatchesInCarousel = false;
      let lastSearchData = null;
      let lastSearchQuery = "";
      let lastSearchTime = 0;

      // Toggle columns
      toggles.forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const column = toggle.dataset.column;
          enabledColumns[column] = !enabledColumns[column];
          toggle.classList.toggle("active");
        });
      });

      // Toggle title matches in carousel
      showTitleMatchesToggle.addEventListener("click", () => {
        showTitleMatchesInCarousel = !showTitleMatchesInCarousel;
        showTitleMatchesToggle.classList.toggle("active");
        showTitleMatchesToggle.style.background = showTitleMatchesInCarousel
          ? "#00ff00"
          : "#444";
        showTitleMatchesToggle.style.color = showTitleMatchesInCarousel
          ? "#000"
          : "#fff";
        showTitleMatchesToggle.style.borderColor = showTitleMatchesInCarousel
          ? "#00ff00"
          : "#666";

        // Re-render with cached data if available
        if (lastSearchData) {
          displayResults(lastSearchData, lastSearchQuery, lastSearchTime);
        }
      });

      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") search();
      });
      searchBtn.addEventListener("click", search);

      async function search() {
        const query = input.value.trim();
        if (query.length < 2) {
          resetDisplay();
          return;
        }

        const start = performance.now();

        try {
          const response = await fetch(
            `${CONFIG.SUPABASE_URL}/rest/v1/rpc/full_search_v2`,
            {
              method: "POST",
              headers: {
                apikey: CONFIG.SUPABASE_KEY,
                Authorization: `Bearer ${CONFIG.SUPABASE_KEY}`,
                "Content-Type": "application/json",
                Range: "0-199",
              },
              body: JSON.stringify({
                search_query: query,
                enabled_columns: enabledColumns,
                result_limit: 5000,
              }),
            },
          );

          if (!response.ok) {
            const errorData = await response.json();
            console.error("API Error:", errorData);
            alert(
              `Error: ${errorData.message}\nHint: ${errorData.hint || "Check console"}`,
            );
            return;
          }

          const data = await response.json();
          const elapsed = Math.round(performance.now() - start);

          if (!Array.isArray(data)) {
            console.error("Invalid response:", data);
            alert("Invalid response from server");
            return;
          }

          // Cache results for toggle feature
          lastSearchData = data;
          lastSearchQuery = query;
          lastSearchTime = elapsed;

          displayResults(data, query, elapsed);
        } catch (error) {
          console.error("Search error:", error);
          alert(`Connection error: ${error.message}`);
        }
      }

      function resetDisplay() {
        stats.style.display = "none";
        carouselSection.style.display = "none";
        resultsSection.style.display = "none";
        carousel.innerHTML = "";
        results.innerHTML = "";
      }

      function displayResults(data, query, time) {
        const carouselItems = data.filter((r) => r.display_type === "carousel");
        const listItems = data.filter((r) => r.display_type === "list");

        // Get title matches from list items (for optional carousel display)
        const titleMatchesInList = listItems.filter((r) =>
          r.matched_columns.includes("title"),
        );

        // Group title matches by poem_id for carousel
        const titleMatchPoemsMap = new Map();
        titleMatchesInList.forEach((item) => {
          if (!titleMatchPoemsMap.has(item.poem_id)) {
            titleMatchPoemsMap.set(item.poem_id, item);
          }
        });
        const titleMatchPoems = Array.from(titleMatchPoemsMap.values());

        // Count unique poems from list items
        const uniquePoemsInList = new Set(listItems.map((r) => r.poem_id)).size;
        const totalPoems = carouselItems.length + uniquePoemsInList;

        // Count title vs line matches
        const titleMatches = data.filter((r) =>
          r.matched_columns.includes("title"),
        ).length;
        const lineOnlyMatches = data.filter(
          (r) =>
            r.matched_columns.includes("line") &&
            !r.matched_columns.includes("title"),
        ).length;

        stats.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                    <div style="background: #333; padding: 12px; border-radius: 6px;">
                        <div style="color: #999; font-size: 11px;">⚡ Search Time</div>
                        <div style="color: #00ff00; font-size: 20px; font-weight: bold;">${time}ms</div>
                    </div>
                    <div style="background: #333; padding: 12px; border-radius: 6px;">
                        <div style="color: #999; font-size: 11px;">🔍 Query</div>
                        <div style="color: #00ff00; font-size: 16px; font-weight: bold;">"${query}"</div>
                    </div>
                    <div style="background: #333; padding: 12px; border-radius: 6px;">
                        <div style="color: #999; font-size: 11px;">📚 Total Poems Found</div>
                        <div style="color: #00ff00; font-size: 20px; font-weight: bold;">${totalPoems}</div>
                    </div>
                    <div style="background: #333; padding: 12px; border-radius: 6px;">
                        <div style="color: #999; font-size: 11px;">📄 Title Matches</div>
                        <div style="color: #ff6b6b; font-size: 20px; font-weight: bold;">${titleMatches}</div>
                    </div>
                    <div style="background: #333; padding: 12px; border-radius: 6px;">
                        <div style="color: #999; font-size: 11px;">📝 Line Matches</div>
                        <div style="color: #4ecdc4; font-size: 20px; font-weight: bold;">${listItems.length}</div>
                    </div>
                    <div style="background: #333; padding: 12px; border-radius: 6px;">
                        <div style="color: #999; font-size: 11px;">🎯 Title-Only Poems</div>
                        <div style="color: #ffe66d; font-size: 20px; font-weight: bold;">${carouselItems.length}</div>
                    </div>
                </div>
            `;
        stats.style.display = "block";

        // Carousel - show title-only + optionally all title matches
        const carouselData = showTitleMatchesInCarousel
          ? [...carouselItems, ...titleMatchPoems]
          : carouselItems;

        if (carouselData.length > 0) {
          carousel.innerHTML = carouselData
            .map((r) => {
              const isTitleOnly = r.display_type === "carousel";
              const borderColor = isTitleOnly ? "#00ff00" : "#ff6b6b";
              const label = isTitleOnly
                ? "📄 Title match only"
                : "📄 Title + Line match";

              return `
                        <div class="carousel-item" onclick="alert('poem_id: ${r.poem_id}')" style="border-color: ${borderColor};">
                            <div class="carousel-title">${highlight(r.title_cleaned, query, r.highlight_words)}</div>
                            <div style="color: #666; font-size: 12px; margin-top: 8px;">${label}</div>
                        </div>
                    `;
            })
            .join("");
          carouselSection.style.display = "block";
        } else {
          carouselSection.style.display = "none";
        }

        // Line matches
        if (listItems.length > 0) {
          results.innerHTML = listItems
            .map((r) => {
              const hasTitle = r.matched_columns.includes("title");
              const hasLine = r.matched_columns.includes("line");

              // Get metadata matches
              const metadataMatches = r.matched_columns.filter(
                (col) => !["title", "line"].includes(col),
              );

              // Determine match type and color
              let matchType, borderColor;
              if (hasTitle && hasLine) {
                matchType = "📄+📝 Title + Line";
                borderColor = "#ff6b6b";
              } else if (hasTitle) {
                matchType = "📄 Title Only";
                borderColor = "#ff6b6b";
              } else if (hasLine) {
                matchType = "📝 Line Only";
                borderColor = "#4ecdc4";
              } else if (metadataMatches.length > 0) {
                // Metadata only - show which ones
                const icons = {
                  entities: "👤",
                  places: "📍",
                  events: "📅",
                  religion: "☪️",
                  subjects: "🏷️",
                  animals: "🦁",
                  sentiments: "💭",
                };
                matchType = metadataMatches
                  .map((m) => `${icons[m] || "🔸"} ${m}`)
                  .join(", ");
                borderColor = "#9b59b6";
              } else {
                matchType = "Unknown";
                borderColor = "#666";
              }

              return `
                        <div class="result" style="border-left-color: ${borderColor};">
                            <div class="result-header">
                                <div class="result-title" style="color: ${borderColor};">
                                    ${highlight(r.title_cleaned, query, r.highlight_words)}
                                </div>
                                <div class="priority-badge" style="background: ${borderColor}; color: #000;">
                                    ${matchType}
                                </div>
                            </div>
                            
                            <div class="result-line">${highlight(r.poem_line_cleaned, query, r.highlight_words)}</div>
                            
                            <div class="result-meta">
                                poem_id: ${r.poem_id} | row_id: ${r.row_id} | matched: [${r.matched_columns.join(", ")}]
                            </div>
                        </div>
                    `;
            })
            .join("");
          resultsSection.style.display = "block";
        } else {
          resultsSection.style.display = "none";
        }
      }

      function highlight(text, query, highlightWords) {
        if (!text) return text || "";

        // Collect all words to highlight from different sources
        let wordsToHighlight = [];

        // Add words from highlight_words JSONB (from PostgreSQL)
        if (highlightWords) {
          [
            "entities",
            "animals",
            "places",
            "sentiments",
            "subjects",
            "events",
            "religion",
          ].forEach((key) => {
            if (highlightWords[key] && Array.isArray(highlightWords[key])) {
              wordsToHighlight.push(...highlightWords[key]);
            }
          });
        }

        // Also add the original query
        if (query) {
          wordsToHighlight.push(query);
        }

        // Remove duplicates and empty strings
        wordsToHighlight = [...new Set(wordsToHighlight)].filter(
          (w) => w && w.trim(),
        );

        if (wordsToHighlight.length === 0) return text;

        // Build regex pattern for all words
        const escapedWords = wordsToHighlight.map((w) =>
          w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
        );
        const regex = new RegExp(`(${escapedWords.join("|")})`, "gi");

        return text.replace(regex, "<mark>$1</mark>");
      }

      input.focus();
    </script>
  </body>
</html>
